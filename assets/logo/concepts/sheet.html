<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:1600px;font-family:'Malgun Gothic',sans-serif;background:#fff}
.row{display:flex;gap:40px;padding:40px 60px;justify-content:center}
.card{text-align:center;font-size:30px;color:#333}
.big{width:300px;height:300px;border-radius:67px;overflow:hidden;display:block;margin-bottom:14px}
.home{display:flex;gap:56px;justify-content:center;padding:36px 0}
.home.light{background:#EDEFF2}.home.dark{background:#111;}
.app{text-align:center;font-size:20px}.light .app{color:#222}.dark .app{color:#eee}
.sm{width:120px;height:120px;border-radius:27px;overflow:hidden;display:block;margin:0 auto 8px}
</style></head><body>
<div class="row">
<div class="card"><img class="big" src="1-slot.svg">1. 저금 슬롯</div>
<div class="card"><img class="big" src="2-stack.svg">2. 자라는 동전</div>
<div class="card"><img class="big" src="3-leaf.svg">3. 잎사귀 동전</div>
<div class="card"><img class="big" src="4-grass.svg">4. 기록 잔디</div>
</div>
<div class="home light"><div class="app"><img class="sm" src="1-slot.svg">SaveLog</div><div class="app"><img class="sm" src="2-stack.svg">SaveLog</div><div class="app"><img class="sm" src="3-leaf.svg">SaveLog</div><div class="app"><img class="sm" src="4-grass.svg">SaveLog</div></div>
<div class="home dark"><div class="app"><img class="sm" src="1-slot.svg">SaveLog</div><div class="app"><img class="sm" src="2-stack.svg">SaveLog</div><div class="app"><img class="sm" src="3-leaf.svg">SaveLog</div><div class="app"><img class="sm" src="4-grass.svg">SaveLog</div></div>
</body></html>
