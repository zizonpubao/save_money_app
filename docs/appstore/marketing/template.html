<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SaveLog 스토어 이미지</title>
<!--
  App Store 소개 이미지 템플릿 (1206×2622, 아이폰 17 Pro 규격).
  template.html?n=1..5 를 헤드리스 Edge 로 찍고 ffmpeg 로 RGB(알파 없음) PNG 로 바꾼다. 만드는 법은 README.md 참고.
  화면 캡처는 shots/ 에 둔다 (라이트 모드, 예시 기록).
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root { --cream:#FFF8EA; --orange:#FFB24A; --sub:#D5EBDC; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1206px; height:2622px; overflow:hidden; }
  body { font-family:'Pretendard Variable','Malgun Gothic',sans-serif; position:relative; }
  /* 앱 아이콘과 같은 숲 초록 그라데이션. 라이트 모드 화면과 크림색 돼지가 또렷하게 뜬다 */
  .bg { position:absolute; inset:0; background:linear-gradient(165deg,#2F9A62 0%,#23794B 42%,#17573A 100%); }
  .blob { position:absolute; border-radius:50%; filter:blur(80px); }
  .b1 { width:820px; height:820px; left:-320px; top:520px; background:#5FC98D; opacity:.38; }
  .b2 { width:900px; height:900px; right:-360px; top:1500px; background:#0E3F29; opacity:.5; }
  .copy { position:absolute; left:0; right:0; top:190px; text-align:center; padding:0 70px; z-index:5; }
  h1 { font-size:124px; line-height:1.24; font-weight:800; letter-spacing:-4px; color:var(--cream); }
  h1 em { font-style:normal; color:var(--orange); }
  p { margin-top:40px; font-size:54px; line-height:1.4; font-weight:500; letter-spacing:-1.2px; color:var(--sub); }
  .phone { position:absolute; left:50%; top:770px; width:850px; margin-left:-425px; padding:24px; background:#101214; border-radius:138px; box-shadow:0 0 0 5px #2B3136, 0 70px 130px rgba(4,32,20,.55); z-index:3; }
  .phone img { display:block; width:802px; border-radius:116px; }
  .island { position:absolute; left:50%; top:56px; width:238px; height:70px; margin-left:-119px; background:#000; border-radius:40px; }
  .pig { position:absolute; z-index:6; filter:drop-shadow(0 34px 44px rgba(4,32,20,.45)); }
  .coin { position:absolute; z-index:4; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; color:#C96A12; background:radial-gradient(circle at 32% 26%,#FFE0A6 0%,#FFB65C 48%,#EE8C2C 100%); box-shadow:inset 0 0 0 7px #FFCF8A, inset 0 0 0 11px rgba(201,106,18,.35), 0 22px 36px rgba(4,32,20,.4); }
</style>
</head>
<body>
<div class="bg"></div><div class="blob b1"></div><div class="blob b2"></div>
<div class="copy"><h1 id="h"></h1><p id="s"></p></div>
<div class="phone" id="phone"><img id="shot" alt=""><div class="island"></div></div>
<div id="decor"></div>
<script>
  const SLIDES = {
    1: { h:'안 쓴 돈을<br><em>기록</em>하면 쌓여요', s:'오늘 참은 커피 한 잔부터 시작해요', shot:'shots/1-home.png',
         pig:{ w:350, left:850, top:620 }, coins:[[70,700,128,-16],[205,640,76,14]] },
    2: { h:'버튼 몇 번이면<br>기록 <em>끝</em>', s:'누를 때마다 짤랑, 동전 소리와 진동까지', shot:'shots/2-entry.png',
         pig:{ w:300, left:30, top:640 }, coins:[[1010,720,120,16],[930,650,72,-12]] },
    3: { h:'한 달 얼마 아꼈는지<br><em>한눈에</em>', s:'일별 그래프와 카테고리별 절약액', shot:'shots/3-records.png',
         pig:{ w:300, left:880, top:640 }, coins:[[80,720,120,-14],[200,650,72,12]] },
    4: { h:'아낀 만큼<br><em>자랑</em>해요', s:'절약 금액을 이미지로 만들어 공유해요', shot:'shots/4-share.png',
         pig:{ w:300, left:30, top:640 }, coins:[[1010,720,120,14],[930,650,72,-14]] },
    5: { h:'알림도 소리도<br><em>내 마음대로</em>', s:'회원가입 없이, 기록은 내 아이폰에만', shot:'shots/5-settings.png',
         pig:{ w:300, left:880, top:640 }, coins:[[80,720,120,-12],[200,650,72,16]] },
  };
  const n = new URLSearchParams(location.search).get('n') || '1';
  const d = SLIDES[n];
  document.getElementById('h').innerHTML = d.h;
  document.getElementById('s').textContent = d.s;
  document.getElementById('shot').src = d.shot;
  const decor = document.getElementById('decor');
  const pig = new Image(); pig.src = '../../../assets/images/android-icon-foreground.png'; pig.className = 'pig';
  pig.style.cssText = `width:${d.pig.w * 1.9}px;left:${d.pig.left - d.pig.w * .45}px;top:${d.pig.top - d.pig.w * .45}px`;
  decor.appendChild(pig);
  for (const [x,y,r,rot] of d.coins) { const c = document.createElement('div'); c.className='coin'; c.textContent='₩'; c.style.cssText=`left:${x}px;top:${y}px;width:${r}px;height:${r}px;font-size:${r*.5}px;transform:rotate(${rot}deg)`; decor.appendChild(c); }
</script>
</body>
</html>
